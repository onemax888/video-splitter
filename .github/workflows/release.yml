name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Build target platform'
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
          - linux

permissions:
  contents: write

jobs:
  build:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || matrix.os == github.event.inputs.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
            name: 'macOS-ARM64'
            os: macos
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
            name: 'macOS-Intel'
            os: macos
          - platform: 'ubuntu-22.04'
            args: ''
            name: 'Linux'
            os: linux
          - platform: 'windows-latest'
            args: ''
            name: 'Windows'
            os: windows

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download AppImage tools (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p ~/.cache/tauri
          cd ~/.cache/tauri
          # Download linuxdeploy with retries
          for i in {1..3}; do
            curl -L -o linuxdeploy-x86_64.AppImage https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage && break
            echo "Retry $i..."
            sleep 5
          done
          chmod +x linuxdeploy-x86_64.AppImage || true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build the app (non-tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Build the app (tag/release)
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Video Clipping ${{ github.ref_name }}'
          releaseBody: |
            ## 🎬 Video Clipping ${{ github.ref_name }}
            
            高效的视频切片工具，支持多种视频格式。
            
            ### 下载
            - **macOS (Apple Silicon)**: `Video_Clipping_*_aarch64.dmg`
            - **macOS (Intel)**: `Video_Clipping_*_x64.dmg`
            - **Windows**: `Video_Clipping_*_x64-setup.exe` 或 `.msi`
            - **Linux**: `Video_Clipping_*_amd64.deb` 或 `.AppImage`
            
            ### 系统要求
            - 需要安装 FFmpeg
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Upload Windows artifacts (manual, non-tag)
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.platform == 'windows' && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: Video-Clipping-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/**

